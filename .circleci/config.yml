version: 2.1

orbs:
  rok8s: fairwinds/rok8s-scripts@17.0.0
  slack: circleci/slack@6.1.3

commands:
  set_vault:
    description: Install and configure vault
    steps:
      - run: ./.circleci/scripts/vault.sh
      - rok8s/get_vault_env:
          vault_path: repo/global/env

  notify_slack_on_failure:
    description: |
      Alert Slack when a release-path job fails. Must be the last step of a job, and the
      job must have already loaded SLACK_ACCESS_TOKEN from vault (repo/global/env).
    steps:
      - slack/notify:
          event: fail
          branch_pattern: master
          channel: CPYBX810T # pod-dev-notifications
          template: basic_fail_1

references:
  setup_environment: &setup_environment
    run:
      name: Setup Environment
      command: |
        echo 'export CI_SHA1=$CIRCLE_SHA1' >> ${BASH_ENV}
        echo 'Install AWS CLI'
        apk --no-cache add aws-cli
        echo 'Install needed packages'
        apk --no-cache add bash jq curl yq

  check_changelog: &check_changelog
    run:
      name: Check CHANGELOG
      command: |
        require_changelog=( insights-agent fairwinds-insights insights-admission )
        for chart in "${require_changelog[@]}"; do
          version=$(yq eval '.version' ./stable/$chart/Chart.yaml )
          echo "Checking if CHANGELOG.md is updated for $chart"
          grep "## $version" ./stable/$chart/CHANGELOG.md
        done

  install_vault_alpine: &install_vault_alpine
    run:
      name: install hashicorp vault
      command: |
        apk --update add curl yq
        cd /tmp
        curl -LO https://releases.hashicorp.com/vault/1.13.2/vault_1.13.2_linux_amd64.zip
        sha256sum vault_1.13.2_linux_amd64.zip | grep f7930279de8381de7c532164b4a4408895d9606c0d24e2e9d2f9acb5dfe99b3c
        unzip vault_1.13.2_linux_amd64.zip
        mv vault /usr/bin/vault

  kind_configuration_helm3: &kind_configuration_helm3
    pre_script: scripts/circle-pre-e2e.sh
    script: scripts/circle-e2e.sh
    command_runner_image: quay.io/helmpack/chart-testing:v3.14.0
    requires:
      - lint-scripts
      - lint-charts
      - check-helm-docs
    filters:
      branches:
        only: /.*/
      tags:
        ignore: /.*/

executors:
  ci-images:
    docker:
      - image: quay.io/reactiveops/ci-images:v15-cimg-24.04
  ci-images-xlarge-gen2:
    resource_class: xlarge.gen2
    docker:
      - image: quay.io/reactiveops/ci-images:v15-cimg-24.04

jobs:
  # On Renovate PRs, update CHANGELOG.md and regenerate helm-docs READMEs, then push to the PR branch.
  bump_renovate_pr_changelog:
    executor: ci-images
    steps:
      - checkout
      - set_vault
      - run:
          name: Bump changelog and helm-docs for Renovate PR
          command: ./.circleci/scripts/bump-renovate-pr.sh

  check-helm-docs:
    executor: ci-images
    steps:
      - checkout
      - run:
          name: Install helm-docs
          command: |
            HELM_DOCS_VERSION=1.14.2
            cd /tmp
            curl -LO "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz"
            tar -zxvf "helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz"
            mv helm-docs /usr/local/bin/helm-docs
            chmod +x /usr/local/bin/helm-docs
      - run:
          name: Check Docs for Changes
          command: |
            helm-docs --sort-values-order=file
            git diff --exit-code
      - *check_changelog

  lint-scripts:
    docker:
      - image: koalaman/shellcheck-alpine:v0.11.0
    steps:
      - checkout
      - run:
          name: lint
          command: |
            for script in $(ls scripts/*.sh); do
                shellcheck -x $script
            done
      - run:
          name: lint-pre-scripts
          command: |
            for script in $(find incubator stable -type f -name pre-test-script.sh); do
                shellcheck -x $script
            done

  lint-charts:
    docker:
      - image: quay.io/helmpack/chart-testing:v3.14.0
    steps:
      - checkout
      - *setup_environment
      - run:
          name: lint
          command: |
            git remote add ro https://github.com/fairwindsops/charts
            git fetch ro master
            ct lint --config scripts/ct.yaml --chart-yaml-schema scripts/schema.yaml --debug --print-config

  sync:
    docker:
      - image: quay.io/helmpack/chart-testing:v3.14.0
    steps:
      - checkout
      - *setup_environment
      - *install_vault_alpine
      - rok8s/get_vault_aws_credentials:
          vault_path: fairwindsops/sts/charts-docs
      - rok8s/get_vault_env:
          vault_path: repo/charts/env
      # SLACK_ACCESS_TOKEN for the notify step below
      - rok8s/get_vault_env:
          vault_path: repo/global/env
      - run:
          name: sync
          command: scripts/sync.sh
      - notify_slack_on_failure

workflows:
  version: 2
  test-and-sync:
    jobs:
      - bump_renovate_pr_changelog:
          filters:
            branches:
              only: /renovate\/.*/
      - check-helm-docs
      - lint-scripts
      - lint-charts
      - rok8s/kubernetes_e2e_tests:
          name: "End-To-End Kubernetes 1.34"
          kind_node_image: "kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d"
          checkout-method: full
          executor:
            name: ci-images-large-gen2
          <<: *kind_configuration_helm3
      - rok8s/kubernetes_e2e_tests:
          name: "End-To-End Kubernetes 1.35"
          kind_node_image: "kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0"
          checkout-method: full
          executor:
            name: ci-images-large-gen2
          <<: *kind_configuration_helm3
      - rok8s/kubernetes_e2e_tests:
          name: "End-To-End Kubernetes 1.36"
          kind_node_image: "kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed"
          checkout-method: full
          executor:
            name: ci-images-large-gen2
          <<: *kind_configuration_helm3
      - rok8s/kubernetes_e2e_tests:
          name: "End-To-End Kubernetes 1.37"
          kind_node_image: "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
          checkout-method: full
          executor:
            name: ci-images-large-gen2
          <<: *kind_configuration_helm3
      - sync:
          requires:
            - lint-scripts
            - lint-charts
            - check-helm-docs
          filters:
            branches:
              only:
                - master
