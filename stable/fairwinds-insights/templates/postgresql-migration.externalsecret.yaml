{{- $externalSecret := .Values.postgresql.auth.migrationExternalSecret | default dict }}
{{- if $externalSecret.create }}
{{- include "fairwinds-insights.validatePostgresqlAuth" . }}
{{- if not $externalSecret.data }}
{{- fail "postgresql.auth.migrationExternalSecret.create is true but postgresql.auth.migrationExternalSecret.data is empty; provide at least one entry with secretKey and remoteRef.key (property optional)." }}
{{- end }}
{{- range $i, $entry := $externalSecret.data }}
{{- if not $entry.secretKey }}
{{- fail (printf "postgresql.auth.migrationExternalSecret.data[%d] is missing required field 'secretKey'" $i) }}
{{- end }}
{{- if not $entry.remoteRef }}
{{- fail (printf "postgresql.auth.migrationExternalSecret.data[%d] is missing required field 'remoteRef'" $i) }}
{{- end }}
{{- if not $entry.remoteRef.key }}
{{- fail (printf "postgresql.auth.migrationExternalSecret.data[%d].remoteRef is missing required field 'key'" $i) }}
{{- end }}
{{- end }}
{{- $secretName := include "fairwinds-insights.postgresqlMigrationSecret" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "fairwinds-insights.postgresqlMigrationExternalSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fairwinds-insights.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-10"
  {{- with $externalSecret.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshPolicy: Periodic
  refreshInterval: {{ $externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $externalSecret.secretStoreRef.name }}
    kind: {{ $externalSecret.secretStoreRef.kind }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    {{- toYaml $externalSecret.data | nindent 4 }}
{{- end }}
