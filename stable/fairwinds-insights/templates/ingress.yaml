{{- if .Values.ingress.enabled }}
{{- $fullName := include "fairwinds-insights.fullname" . -}}
{{/*
The admission path needs wildcards in the middle, so it can only be expressed as
ImplementationSpecific. The AWS LB controller orders Exact, then Prefix (longest
first), then ImplementationSpecific - so any Prefix catch-all would shadow it.
When the admission path is routed, the catch-alls become ImplementationSpecific
star paths too, which keeps them below it in the manifest order the controller honors.
*/}}
{{- $catchAllStars := or .Values.ingress.starPaths .Values.admissionApi.ingress.enabled -}}
{{- $catchAllPathType := .Values.admissionApi.ingress.enabled | ternary "ImplementationSpecific" "Prefix" -}}
{{- if not .Values.ingress.separate }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "fairwinds-insights.labels" . | nindent 4 }}
  annotations:
    {{ with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{ end }}
spec:
{{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
{{- end }}
{{- if .Values.ingress.tls }}
  tls:
    - secretName: {{ $fullName }}-cert
      hosts:
        {{- range .Values.ingress.hostedZones }}
        - {{ include "fairwinds-insights.sanitizedPrefix" $ }}{{ . }}
        {{- end }}
{{- end }}
  rules:
    {{- range .Values.ingress.hostedZones }}
    - host: {{ include "fairwinds-insights.sanitizedPrefix" $ }}{{ . }}
      http:
        paths:
          {{ with $.Values.ingress.extraPaths }}
          {{- toYaml . | nindent 10 }}
          {{ end }}
          {{- if $.Values.openApi.ingress.enabled }}
          - path: {{ $.Values.ingress.starPaths | ternary "/swagger/*" "/swagger" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-open-api
                port:
                  name: http
          {{- end }}
          {{- if $.Values.admissionApi.ingress.enabled }}
          - path: {{ $.Values.admissionApi.ingress.path }}
            pathType: {{ $.Values.admissionApi.ingress.pathType }}
            backend:
              service:
                name: {{ $fullName }}-{{ ternary "admission-api" "api" $.Values.admissionApi.enabled }}
                port:
                  name: http
          {{- end }}
          {{- if $.Values.api.ingress.enabled }}
          - path: {{ $catchAllStars | ternary "/v0/*" "/v0" }}
            pathType: {{ $catchAllPathType }}
            backend:
              service:
                name: {{ $fullName }}-api
                port:
                  name: http
          {{- end }}
          {{- if and $.Values.mcp.enabled $.Values.mcp.ingress.enabled }}
          - path: {{ $.Values.ingress.starPaths | ternary "/mcp/*" "/mcp" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-mcp
                port:
                  name: http
          {{- end }}
          - path: {{ $catchAllStars | ternary "/*" "/" }}
            pathType: {{ $catchAllPathType }}
            backend:
              service:
                name: {{ $fullName }}-dashboard
                port:
                  name: http
    {{- end }}
{{- else }}
{{- if or $.Values.api.ingress.enabled $.Values.admissionApi.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-api
  labels:
    {{- include "fairwinds-insights.labels" . | nindent 4 }}
  annotations:
    {{ with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{ end }}
    {{- if .Values.ingress.api }}
    {{ with .Values.ingress.api.annotations }}
    {{- toYaml . | nindent 4 }}
    {{ end }}
    {{- end }}
spec:
{{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
{{- end }}
{{- if .Values.ingress.tls }}
  tls:
    - secretName: {{ $fullName }}-cert
      hosts:
        {{- range .Values.ingress.hostedZones }}
        - {{ include "fairwinds-insights.sanitizedPrefix" $ }}{{ . }}
        {{- end }}
{{- end }}
  rules:
    {{- range .Values.ingress.hostedZones }}
    - host: {{ include "fairwinds-insights.sanitizedPrefix" $ }}{{ . }}
      http:
        paths:
          {{- if $.Values.admissionApi.ingress.enabled }}
          - path: {{ $.Values.admissionApi.ingress.path }}
            pathType: {{ $.Values.admissionApi.ingress.pathType }}
            backend:
              service:
                name: {{ $fullName }}-{{ ternary "admission-api" "api" $.Values.admissionApi.enabled }}
                port:
                  name: http
          {{- end }}
          {{- if $.Values.api.ingress.enabled }}
          - path: {{ $catchAllStars | ternary "/v0*" "/v0" }}
            pathType: {{ $catchAllPathType }}
            backend:
              service:
                name: {{ $fullName }}-api
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-dashboard
  labels:
    {{- include "fairwinds-insights.labels" . | nindent 4 }}
  annotations:
    {{ with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{ end }}
    {{- if .Values.ingress.dashboard }}
    {{ with .Values.ingress.dashboard.annotations }}
    {{- toYaml . | nindent 4 }}
    {{ end }}
    {{- end }}
spec:
{{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
{{- end }}
{{- if .Values.ingress.tls }}
  tls:
    - secretName: {{ $fullName }}-cert
      hosts:
        {{- range .Values.ingress.hostedZones }}
        - {{ include "fairwinds-insights.sanitizedPrefix" $ }}{{ . }}
        {{- end }}
{{- end }}
  rules:
    {{- range .Values.ingress.hostedZones }}
    - host: {{ include "fairwinds-insights.sanitizedPrefix" $ }}{{ . }}
      http:
        paths:
          {{ with $.Values.ingress.extraPaths }}
          {{- toYaml . | nindent 10 }}
          {{ end }}
          {{- if $.Values.openApi.ingress.enabled }}
          - path: {{ $.Values.ingress.starPaths | ternary "/swagger/*" "/swagger" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-open-api
                port:
                  name: http
          {{- end }}
          {{- if and $.Values.mcp.enabled $.Values.mcp.ingress.enabled }}
          - path: {{ $.Values.ingress.starPaths | ternary "/mcp/*" "/mcp" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-mcp
                port:
                  name: http
          {{- end }}
          - path: {{ $.Values.ingress.starPaths | ternary "/*" "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-dashboard
                port:
                  name: http
    {{- end }}
{{- end }}
{{- end }}
